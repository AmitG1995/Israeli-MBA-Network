<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Israeli MBA Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: search-first single column. Hero search dominates Discover; rails below. Profile = header card + timeline / mutuals two-column. */
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --surface-2:#F7F8F4; --ink:#161A26; --muted:#5C6272; --faint:#8C91A0; --line:#E1E3DC;
  --accent:#2E49C2; --accent-ink:#FFFFFF; --accent-soft:#E8ECFA; --accent-text:#2940A8;
  --warm:#B5641E; --warm-soft:#FBEEDF;
  --ok:#1D7448; --ok-soft:#E2F1E8; --wa:#159447; --wa-soft:#E0F3E7;
  --shadow:0 1px 2px rgba(22,26,38,.05),0 6px 20px rgba(22,26,38,.06);
  --shadow-lg:0 2px 6px rgba(22,26,38,.06),0 22px 56px rgba(22,26,38,.12);
  --scrim:rgba(18,21,32,.42);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F121A; --surface:#171B26; --surface-2:#1C2130; --ink:#E8EAF1; --muted:#A1A7B8; --faint:#757C90; --line:#272D3D;
  --accent:#7D95FF; --accent-ink:#0F1426; --accent-soft:#222A47; --accent-text:#A9B8FF;
  --warm:#F0A764; --warm-soft:#33261A; --ok:#6FD39F; --ok-soft:#173025; --wa:#4AD483; --wa-soft:#15301F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 2px 6px rgba(0,0,0,.3),0 22px 56px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F121A; --surface:#171B26; --surface-2:#1C2130; --ink:#E8EAF1; --muted:#A1A7B8; --faint:#757C90; --line:#272D3D;
  --accent:#7D95FF; --accent-ink:#0F1426; --accent-soft:#222A47; --accent-text:#A9B8FF;
  --warm:#F0A764; --warm-soft:#33261A; --ok:#6FD39F; --ok-soft:#173025; --wa:#4AD483; --wa-soft:#15301F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 2px 6px rgba(0,0,0,.3),0 22px 56px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block}
.wrap{max-width:1140px;margin:0 auto;padding-inline:20px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:650;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.top-search{flex:1;max-width:460px;min-width:0}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;position:relative}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warm);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.bottom-nav{display:none}

/* avatar */
.av{display:inline-block;flex:none;border-radius:50%;overflow:hidden;background:var(--surface-2)}
.av svg{width:100%;height:100%}
.av.sq{border-radius:28%}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:11px;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.lg{height:46px;padding:0 20px;font-size:15px;border-radius:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--faint)}
.btn.is-pending{background:var(--warm-soft);color:var(--warm)}
.btn.is-connected{background:var(--ok-soft);color:var(--ok);cursor:default}
.btn.wa{background:var(--wa-soft);color:var(--wa)}
.btn.mail{background:var(--accent-soft);color:var(--accent-text)}
.link{color:var(--accent-text);font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}

/* search */
.search{position:relative;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
.search-ico{position:absolute;left:14px;color:var(--faint);pointer-events:none}
.search-ico svg{width:18px;height:18px}
.search-input{flex:1;min-width:0;border:0;background:transparent;outline:none;height:42px;padding:0 12px 0 42px;font-size:14px}
.search-input::-webkit-search-cancel-button{display:none}
.search-go{display:none}
.search.big{border-radius:20px;box-shadow:var(--shadow-lg)}
.search.big .search-input{height:66px;font-size:18px;padding-left:56px}
.search.big .search-ico{left:20px}
.search.big .search-ico svg{width:22px;height:22px}
.search.big .search-go,.search.mid .search-go{display:inline-flex;margin-right:9px}
.search.mid{border-radius:16px}
.search.mid .search-input{height:54px;font-size:16px;padding-left:48px}
.search.mid .search-ico{left:17px}
.ac{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:8px;z-index:40;max-height:420px;overflow:auto;text-align:left}
.ac-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
.ac-i{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:10px;text-align:left}
.ac-i.on,.ac-i:hover{background:var(--surface-2)}
.ac-i .ico{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.ac-i .ico svg{width:16px;height:16px}
.ac-i b{font-weight:600}
.ac-i small{display:block;color:var(--muted);font-size:12.5px}
.ac-i .kind{margin-left:auto;font-size:12px;color:var(--faint)}
mark{background:none;color:var(--accent-text);font-weight:700}

/* hero */
.hero{padding-block:56px 30px;max-width:760px;margin:0 auto;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ok);background:var(--ok-soft);padding:5px 11px;border-radius:99px}
.eyebrow svg{width:14px;height:14px}
.hero h1{font-family:var(--f-display);font-weight:750;font-size:clamp(30px,5vw,48px);line-height:1.05;letter-spacing:-.03em;margin:18px 0 26px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.shortcuts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.shortcut{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:border-color .15s,box-shadow .15s}
.shortcut:hover{border-color:var(--faint)}
.shortcut.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.shortcut .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex:none}
.shortcut .ico svg{width:19px;height:19px}
.shortcut b{display:block;font-weight:650;font-size:15px}
.shortcut small{color:var(--muted);font-size:12.5px}
.browse{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left}
.browse-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;font-weight:500}
.chip:hover{border-color:var(--accent);color:var(--accent-text)}
.chip .n{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.try{margin-top:18px;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px}
.try button{color:var(--accent-text);font-weight:500}
.try button:hover{text-decoration:underline}

/* rails */
.rail{margin-top:34px}
.rail-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px}
.rail-h h2{font-family:var(--f-display);font-weight:650;font-size:20px;letter-spacing:-.015em;margin:0}
.rail-h p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.rail-h .sp{margin-left:auto;display:flex;align-items:center;gap:6px}
.arrow{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.arrow:hover{color:var(--ink);border-color:var(--faint)}
.arrow svg{width:16px;height:16px}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-width:thin}
.pcard{flex:0 0 212px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.pcard-hit{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;width:100%}
.pcard .nm{font-weight:650;font-size:15.5px;line-height:1.2}
.pcard .rl{color:var(--muted);font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.signal{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);padding:4px 9px;border-radius:8px;align-self:flex-start;max-width:100%}
.signal span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signal svg{width:13px;height:13px;flex:none}
.signal.warm{color:var(--warm);background:var(--warm-soft)}
.pcard-actions{display:flex;gap:8px;margin-top:auto}
.pcard-actions .btn{flex:1}
.empty-rail{padding:22px;border:1px dashed var(--line);border-radius:var(--r-lg);color:var(--muted);font-size:14px;text-align:center;width:100%}

/* results */
.page{padding-block:28px 60px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:14px}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.res-head{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.res-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.res-meta h1{font-family:var(--f-display);font-size:22px;font-weight:650;letter-spacing:-.015em;margin:0}
.res-meta .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.sel{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:13.5px}
.active-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text);font-size:13px;font-weight:600}
.fchip svg{width:14px;height:14px}
.res-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:84px}
.filters h3{margin:0;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.filters label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.filters .sel{width:100%;color:var(--ink);font-weight:500}
.filter-toggle{display:none}
.rlist{display:flex;flex-direction:column;gap:12px}
.rcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.rcard:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.rcard .main{min-width:0;display:flex;flex-direction:column;gap:6px}
.rcard .nm{font-weight:700;font-size:17px;text-align:left}
.rcard .nm:hover{color:var(--accent-text)}
.rcard .rl{font-size:14.5px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:14px;height:14px;color:var(--faint)}
.mut{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);text-align:left}
.stack{display:flex}
.stack .av{border:2px solid var(--surface);margin-left:-8px}
.stack .av:first-child{margin-left:0}
.rcard .acts{display:flex;flex-direction:column;gap:8px}
.tag{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.02em;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);vertical-align:2px;margin-left:6px}
.tag.stu{color:var(--warm);background:var(--warm-soft);border-color:transparent}
.noresults{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg);padding:36px 24px;text-align:center}
.noresults h2{font-family:var(--f-display);font-weight:650;margin:0 0 6px;font-size:21px}
.noresults p{color:var(--muted);margin:0 0 18px}
.noresults .chips{justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.grid .pcard{flex:none}

/* profile */
.phead{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.phead-band{position:relative;height:128px;overflow:hidden;background:linear-gradient(115deg,color-mix(in srgb,var(--sc) 78%,#000) 0%,var(--sc) 70%);color:#fff}
.band-mark{position:absolute;right:26px;bottom:-14px;font-family:var(--f-display);font-weight:750;font-size:clamp(56px,10vw,104px);letter-spacing:-.04em;line-height:1;opacity:.16;white-space:nowrap}
.band-label{position:absolute;right:28px;top:20px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.band-label b{font-family:var(--f-display);font-size:15px;font-weight:650;letter-spacing:.01em}
.band-label span{font-family:var(--f-mono);font-size:12px;opacity:.85}
.school-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 12px}
.school-line .txt b{display:block;font-size:15.5px;font-weight:700}
.school-line .txt span{color:var(--muted);font-size:13.5px}
/* class badge: school + class year is the primary identity marker */
.cb{display:inline-flex;align-items:stretch;border-radius:8px;overflow:hidden;font-weight:700;font-size:12px;line-height:1.2;border:1.5px solid var(--sc);flex:none;vertical-align:middle;white-space:nowrap}
.cb-s{background:var(--sc);color:#fff;padding:3px 7px;letter-spacing:.05em;text-transform:uppercase}
.cb-y{padding:3px 7px;color:color-mix(in srgb,var(--sc) 62%,var(--ink));background:var(--surface);font-family:var(--f-mono);font-weight:500}
.cb-c{padding:3px 7px;background:var(--warm-soft);color:var(--warm);font-size:.85em;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center}
.cb.lg{font-size:16px;border-radius:11px;border-width:2px}
.cb.lg .cb-s,.cb.lg .cb-y,.cb.lg .cb-c{padding:6px 11px}
.cb.md{font-size:13.5px;border-radius:9px}
.cb.md .cb-s,.cb.md .cb-y{padding:4px 9px}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;width:100%}
.pc-top .cbs{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.srow{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,3fr);gap:10px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .sn{display:flex;align-items:center;gap:10px;font-weight:650;text-align:left}
.srow .sn small{color:var(--faint);font-family:var(--f-mono);font-weight:400;font-size:12px}
.sdot{width:12px;height:12px;border-radius:4px;background:var(--sc);flex:none}
.ychip{font-family:var(--f-mono);font-size:13px;padding:5px 10px;border-radius:8px;border:1.5px solid color-mix(in srgb,var(--sc) 45%,var(--line));color:color-mix(in srgb,var(--sc) 62%,var(--ink));background:var(--surface)}
.ychip:hover{background:var(--sc);color:#fff;border-color:var(--sc)}
.ychip .n{opacity:.65;margin-left:4px;font-size:11px}
@media (max-width:560px){.srow{grid-template-columns:1fr}}
.phead-body{padding:0 28px 26px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 24px}
.phead-body > .av{position:relative;z-index:1;margin-top:-56px;border:5px solid var(--surface);box-shadow:var(--shadow)}
.phead-info{padding-top:16px;min-width:0}
.phead h1{font-family:var(--f-display);font-weight:750;font-size:clamp(26px,3.6vw,34px);letter-spacing:-.025em;margin:0;line-height:1.1}
.phead .rl{font-size:16.5px;margin:0 0 8px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vbadge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}
.vbadge svg{width:13px;height:13px}
.vbadge.pref{background:var(--wa-soft);color:var(--wa)}
.vbadge.pref.email{background:var(--accent-soft);color:var(--accent-text)}
.pactions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.pactions .btn{position:relative}
.pref-dot{position:absolute;top:-7px;right:-7px;font-size:10px;font-weight:700;background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:99px}
.how{grid-column:1/-1;margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}
.how b{font-weight:650}
.pgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.panel h2{font-family:var(--f-display);font-weight:650;font-size:19px;letter-spacing:-.015em;margin:0 0 4px}
.panel .sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.side{display:flex;flex-direction:column;gap:20px}
.tl{position:relative;list-style:none;margin:0;padding:0}
.tl li{position:relative;display:grid;grid-template-columns:92px 22px minmax(0,1fr);gap:0 12px;padding-bottom:22px}
.tl li:last-child{padding-bottom:0}
.tl .yr{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:9px;text-align:right;font-variant-numeric:tabular-nums}
.tl .rail-l{position:relative;display:flex;justify-content:center}
.tl .rail-l::before{content:"";position:absolute;top:22px;bottom:-22px;width:2px;background:var(--line)}
.tl li:last-child .rail-l::before{display:none}
.tl .dot{width:14px;height:14px;border-radius:50%;margin-top:9px;background:var(--surface);border:3px solid var(--line);position:relative;z-index:1}
.tl li.now .dot{border-color:var(--accent);background:var(--accent)}
.tl li.edu .dot{border-color:var(--sc,var(--warm));border-radius:4px;transform:rotate(45deg)}
.tl .entry{display:flex;gap:12px;align-items:flex-start;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:750;font-size:16px;color:#fff}
.tl .co{font-weight:700;font-size:15.5px}
.tl .ro{color:var(--muted);font-size:14px}
.tl .now-tag{font-size:11px;font-weight:700;color:var(--accent-text);background:var(--accent-soft);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
.mlist{display:flex;flex-direction:column;gap:4px}
.mrow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;text-align:left;width:100%}
.mrow:hover{background:var(--surface-2)}
.mrow b{display:block;font-weight:650;font-size:14.5px}
.mrow small{color:var(--muted);font-size:13px}
.mrow .chev{color:var(--faint)}
.mrow .chev svg{width:16px;height:16px}
.common{display:flex;flex-direction:column;gap:10px}
.common div{display:flex;gap:10px;align-items:center;font-size:14px}
.common .ico{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.common .ico svg{width:15px;height:15px}
.muted{color:var(--muted)}

/* network */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow-x:auto}
.tabs button{padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.req{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;flex-wrap:wrap}
.req .who{flex:1;min-width:180px;text-align:left}
.req .note{flex-basis:100%;font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:0}
.page-h1{font-family:var(--f-display);font-weight:750;font-size:30px;letter-spacing:-.025em;margin:0 0 6px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button svg{width:14px;height:14px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{width:min(480px,100%);background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);padding:24px;max-height:90vh;overflow:auto;animation:pop .18s ease-out}
.modal h3{font-family:var(--f-display);font-weight:650;font-size:21px;margin:0 0 4px;letter-spacing:-.015em}
.modal .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.modal textarea{width:100%;min-height:118px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);resize:vertical;font-size:14px;line-height:1.5}
.modal textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mini{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface-2);margin-bottom:14px}
.mini b{display:block}
.mini small{color:var(--muted)}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between}
.handoff{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 0 10px;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:currentColor;animation:spin .8s linear infinite}
.wa-chat{background:var(--wa-soft);border-radius:16px;padding:14px;margin:4px 0 14px}
.bubble{background:var(--surface);border-radius:12px 12px 4px 12px;padding:10px 12px;font-size:14px;margin-left:24px;box-shadow:var(--shadow);white-space:pre-wrap}
.kv{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:14px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.kv dt{color:var(--muted);font-size:12.5px;font-weight:600}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;user-select:all}
.mail-body{white-space:pre-wrap;font-size:14px;background:var(--surface-2);border-radius:12px;padding:12px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:12px 14px 12px 16px;border-radius:14px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:14px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);animation:up .2s ease-out}
.toast button{color:var(--bg);background:color-mix(in srgb,var(--bg) 18%,transparent);padding:6px 10px;border-radius:9px;font-weight:700;font-size:13px;white-space:nowrap}
.demo-note{font-size:12px;color:var(--faint);text-align:center;padding:30px 0 10px}
/* LinkedIn-style editing */
.phead-body{position:relative}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn svg{width:19px;height:19px}
.intro-edit{position:absolute;top:12px;right:14px}
.av-edit{position:relative;z-index:1;margin-top:-56px;border-radius:50%;align-self:start;justify-self:start}
.av-edit .av{border:5px solid var(--surface);box-shadow:var(--shadow)}
.av-edit .cam{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow)}
.av-edit .cam svg{width:17px;height:17px}
.av-edit:hover .av{filter:brightness(.94)}
.panel-h{display:flex;align-items:flex-start;gap:6px}
.panel-h > div{flex:1;min-width:0}
.lcol{display:flex;flex-direction:column;gap:20px;min-width:0}
.about{white-space:pre-wrap;font-size:15px;line-height:1.6;margin:0}
.tl .row-edit{margin-left:auto;align-self:flex-start;width:34px;height:34px}
.tl .entry > div{min-width:0;flex:1}
.addlink{display:inline-flex;align-items:center;gap:6px;color:var(--accent-text);font-weight:600;font-size:14px}
.addlink svg{width:16px;height:16px}
.strength .bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:10px 0 14px}
.strength .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.strength .todo{display:flex;align-items:center;gap:10px;width:100%;padding:8px 6px;border-radius:10px;text-align:left;font-size:14px}
.strength .todo:hover{background:var(--surface-2)}
.strength .todo .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.strength .todo.done{color:var(--muted);text-decoration:line-through}
.strength .todo.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.strength .todo .ck svg{width:12px;height:12px}
.modal.edit{width:min(600px,100%);padding:0;display:flex;flex-direction:column;max-height:min(88vh,820px)}
.edit-h{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 14px 24px;border-bottom:1px solid var(--line)}
.edit-h h3{margin:0;font-size:19px}
.edit-b{padding:14px 24px 22px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.edit-f{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--line)}
.edit-f .sp{flex:1}
.req-note{font-size:12.5px;color:var(--muted);margin:0}
.field{display:flex;flex-direction:column;gap:5px}
.field > label,.field > .fl{font-size:13.5px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=email],.field input[type=tel],.field select,.field textarea{height:42px;border:1px solid var(--faint);border-radius:8px;padding:0 12px;background:var(--surface);font-size:15px;width:100%}
.field textarea{height:auto;min-height:130px;padding:10px 12px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:#C2362F}
.field .err{color:#C2362F;font-size:12.5px;font-weight:600;margin:0}
.field .hint{color:var(--faint);font-size:12.5px;margin:0;display:flex;justify-content:space-between}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checkrow{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer}
.checkrow input{width:18px;height:18px;accent-color:var(--accent)}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.radios input{accent-color:var(--accent)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);font-size:13.5px}
.notice svg{width:17px;height:17px;flex:none;margin-top:1px}
.btn.pill{border-radius:99px}
.btn.danger{color:var(--muted);background:none;padding:0 6px}
.btn.danger:hover{color:#C2362F}
.sec-list{display:flex;flex-direction:column}
.sec-item{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line);text-align:left;width:100%}
.sec-item:first-child{border-top:0}
.sec-item:hover b{color:var(--accent-text)}
.sec-item .ico{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.sec-item .ico svg{width:18px;height:18px}
.sec-item small{display:block;color:var(--muted);font-size:13px}
.sec-item .chev{margin-left:auto;color:var(--faint)}
.sec-item .chev svg{width:16px;height:16px}
.photo-prev{display:grid;place-items:center;padding:12px 0}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (max-width:560px){.two{grid-template-columns:1fr}}
/* LinkedIn-style search + connections */
.res-wrap{max-width:880px;margin:0 auto}
.btn.outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent-text)}
.btn.outline:hover{background:var(--accent-soft);filter:none}
.btn.outline.is-pending{border-color:var(--warm);color:var(--warm);background:transparent}
.btn.outline.is-connected{border-color:var(--ok);color:var(--ok);background:transparent}
.pillbar{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.pillw{position:relative}
.fpill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 14px;border-radius:99px;border:1px solid var(--faint);background:var(--surface);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.fpill svg{width:15px;height:15px;transition:transform .15s}
.fpill:hover{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fpill.on{background:var(--ok);border-color:var(--ok);color:#fff}
.fpill.on:hover{box-shadow:none;filter:brightness(1.08)}
.fpill.open svg{transform:rotate(180deg)}
.fpill.type{background:var(--ok);border-color:var(--ok);color:#fff;cursor:default}
.vsep{width:1px;height:24px;background:var(--line);margin:0 2px}
.fpanel{position:absolute;top:calc(100% + 8px);left:0;z-index:45;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;max-height:420px}
.fopts{padding:10px 8px;overflow:auto}
.fopt{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14.5px}
.fopt:hover{background:var(--surface-2)}
.fopt input{width:18px;height:18px;accent-color:var(--ok);flex:none}
.fopt .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.fhead{display:none;padding:14px 16px 0;font-weight:700;font-size:16px}
.ffoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.rbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.rbox-h{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}
.rbox-h .sp{margin-left:auto}
.rl2{list-style:none;margin:0;padding:0}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:start;padding:16px 20px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .main{min-width:0;display:flex;flex-direction:column;gap:4px}
.nmline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nmline .nm{font-weight:700;font-size:16.5px;text-align:left}
.nmline .nm:hover{color:var(--accent-text);text-decoration:underline}
.deg{color:var(--muted);font-size:14px}
.rrow .rl{font-size:14.5px}
.rrow .sub2{font-size:13px;color:var(--muted)}
.rrow .signal{margin-top:4px}
button.mut{margin-top:2px}
button.mut:hover span:last-child{text-decoration:underline;color:var(--accent-text)}
button.how{width:100%;text-align:left;cursor:pointer}
button.how:hover{border-color:var(--faint)}
button.how .chev{margin-left:auto;color:var(--faint)}
button.how .chev svg{width:16px;height:16px}
.drawer-scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;justify-content:flex-end;animation:fade .15s}
.drawer{width:min(460px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slide .2s ease-out}
.drawer .edit-b{gap:0;padding:0 24px}
.dsec{padding:18px 0;border-bottom:1px solid var(--line)}
.dsec:last-child{border-bottom:0}
.dsec h4{margin:0 0 8px;font-size:16px;font-weight:700}
.dsec .fopts{padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
.dsec .fopt{padding:6px 4px}
@keyframes slide{from{transform:translateX(40px);opacity:.5}}
.conn-head{padding:20px 20px 0}
.conn-head h1{font-family:var(--f-display);font-weight:650;font-size:22px;margin:0;letter-spacing:-.015em}
.conn-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.conn-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.conn-tools .sp{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.conn-tools label{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.conn-tools select{border:0;background:transparent;font-weight:700;font-size:13.5px;color:var(--ink);cursor:pointer}
.mini-search{position:relative;flex:1;min-width:180px;max-width:300px}
.mini-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.mini-search input{width:100%;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px 0 34px;font-size:14px}
.mini-search input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.seg-tabs{display:flex;gap:6px;padding:14px 20px 0}
.empty-row{padding:30px 20px;text-align:center;color:var(--muted)}
@media (max-width:720px){
  .pillbar{flex-wrap:nowrap;overflow-x:auto;margin-inline:-20px;padding-inline:20px;scrollbar-width:none}
  .fhead{display:block}
  .fpanel{position:fixed;left:12px;right:12px;top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:auto}
  .rrow{grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 16px}
  .rrow .acts{grid-column:2}
  .rrow .av{width:52px!important;height:52px!important}
  .dsec .fopts{grid-template-columns:1fr}
}
/* join / LinkedIn import */
.join{max-width:640px;margin:0 auto;padding-block:28px 80px}
.steps{display:flex;gap:6px;margin-bottom:22px;list-style:none;padding:0}
.steps li{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--faint)}
.steps li::before{content:"";height:4px;border-radius:99px;background:var(--line)}
.steps li.on{color:var(--ink)}
.steps li.on::before,.steps li.done::before{background:var(--accent)}
.steps li.done{color:var(--muted)}
.jcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px}
.jcard h1{font-family:var(--f-display);font-weight:750;font-size:clamp(24px,4vw,30px);letter-spacing:-.025em;margin:0 0 8px;text-wrap:balance}
.jcard .lead{color:var(--muted);font-size:15.5px;margin:0 0 20px;max-width:60ch}
.jcard .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.invite{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:20px}
.invite b{display:block}
.invite small{color:var(--muted)}
.btn.li{background:#0A66C2;color:#fff}
.btn.li:hover{filter:brightness(1.08)}
.fine{font-size:12.5px;color:var(--faint);margin:14px 0 0;line-height:1.5}
.gotlist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gotlist li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);font-size:14.5px}
.gotlist li:first-child{border-top:0}
.gotlist .k{color:var(--muted);width:140px;flex:none;font-size:13.5px}
.gotlist .v{min-width:0;flex:1;font-weight:600}
.gotlist .ok{color:var(--ok)}
.gotlist .ok svg{width:16px;height:16px}
.src{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap}
.src.pdf{background:var(--warm-soft);color:var(--warm)}
.src.you{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.drop{margin-top:16px;border:1.5px dashed var(--faint);border-radius:16px;padding:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface-2)}
.drop .ico{width:44px;height:44px;border-radius:12px;background:var(--warm-soft);color:var(--warm);display:grid;place-items:center;flex:none}
.drop .ico svg{width:22px;height:22px}
.drop .t{flex:1;min-width:200px}
.drop .t > b{display:block}
.drop .t small{color:var(--muted);font-size:13px}

const ENT = {school:[],company:[],industry:[],role:[],location:[],status:[]};
Object.entries(SCHOOLS).forEach(([k,v])=>v.aliases.forEach(a=>ENT.school.push([a,k])));
const ALL_COMPANIES = [...new Set(P.flatMap(p=>[p.curCompany,...p.prev]).filter(Boolean))];

Object.entries(STATUS).forEach(([k,v])=>v.forEach(a=>ENT.status.push([a,k])));
Object.values(ENT).forEach(l=>l.sort((a,b)=>b[0].length-a[0].length));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const STOP = new Set('people person from at in who worked working works work the and of with a an for to ex former formerly currently based all show me find someone israelis israeli mba mbas grads live living near area that are is on or my'.split(' '));
const ORDER = ['school','company','location','industry','role','status'];

function parseQuery(q){
  let s = ' '+q.toLowerCase().replace(/[\u2018\u2019]/g,"'")+' ';
  const facets = {school:[],company:[],location:[],industry:[],role:[],status:[],year:[]};
  const addY = y=>{ if(!facets.year.includes(y)) facets.year.push(y); };
  s = s.replace(/class of\s*(20\d{2})/g,(m,y)=>{addY(+y);return ' '});
  s = s.replace(/(^|[^a-z0-9])(20[12]\d)(?=$|[^0-9])/g,(m,a,y)=>{addY(+y);return a+' '});
  s = s.replace(/'(\d{2})(?=$|[^0-9])/g,(m,y)=>{addY(2000+ +y);return ' '});
  for(const t of ORDER){
    for(const [alias,val] of ENT[t]){
      const re = new RegExp('(^|[^a-z0-9])'+reEsc(alias)+'(?=$|[^a-z0-9])','g');
      if(re.test(s)){ if(!facets[t].includes(val)) facets[t].push(val); s = s.replace(re,'$1 '); }
    }
  }
  const rest = s.split(/[^a-z0-9]+/).filter(w=>w && !STOP.has(w));
  return {facets,rest};
}
function matchFacets(p,f){
  if(f.school.length && !p.schools.some(s=>f.school.includes(s.school))) return false;
  if(f.year && f.year.length && !p.schools.some(s=>f.year.includes(s.year) && (!f.school.length || f.school.includes(s.school)))) return false;
  if(f.company.length && !f.company.some(c=>p.curCompany===c||p.prev.includes(c))) return false;
  if(f.industry.length && !f.industry.includes(p.industry)) return false;
  if(f.role.length && !f.role.includes(p.roleCat)) return false;
  if(f.location.length && !f.location.includes(p.location)) return false;
  if(f.status.length && !f.status.includes(p.status)) return false;
  return true;
}
function reasonFor(p,f,rest){
  const parts=[];
  f.school.forEach(s=>{const e=p.schools.find(x=>x.school===s); if(e) parts.push(schoolTag(e))});
  if(!f.school.length && f.year.length){ const e=p.schools.find(x=>f.year.includes(x.year)); if(e) parts.push(schoolTag(e)); }
  f.company.forEach(c=>{ if(p.curCompany===c) parts.push(`Currently at ${c}`); else if(p.prev.includes(c)) parts.push(`Worked at ${c}`)});
  f.industry.forEach(i=>{ if(p.industry===i) parts.push(i)});
  f.role.forEach(r=>{ if(p.roleCat===r) parts.push(r==='Founder'?'Founder':r==='Investor'?'Investor':r+' role')});
  f.location.forEach(l=>{ if(p.location===l) parts.push(l)});
  f.status.forEach(s=>{ if(p.status===s) parts.push(s==='Student'?'Current student':'Alum')});
  if(parts.length===1 && /^(Currently|Worked)/.test(parts[0])) return parts[0];
  if(parts.length) return 'Matches: '+parts.join(' + ');
  if(rest.length) return 'Name or title match';
  return relevance(p).txt;
}
const FILTER_DEFS = [
  ['degree','Connections',p=>[degreeOf(p)]],
  ['school','School',p=>p.schools.map(s=>s.school)],
  ['year','Class year',p=>p.schools.map(s=>String(s.year))],
  ['curCompany','Current company',p=>p.curCompany?[p.curCompany]:[]],
  ['prevCompany','Previous company',p=>p.prev],
  ['industry','Industry',p=>[p.industry]],
  ['role','Role',p=>[p.roleCat]],
  ['location','Location',p=>[p.location]],
  ['program','Program',p=>p.schools.map(s=>s.program)],
  ['status','Student / Alum',p=>[p.status]],
];
function runSearch(q){
  const {facets,rest} = parseQuery(q);
  const hasFacets = Object.values(facets).some(a=>a.length);
  let base = P.filter(p=>p.id!==ME && matchFacets(p,facets));
  if(rest.length){
    const r = base.filter(p=>rest.every(t=>p.words.some(w=>w.startsWith(t))));
    if(r.length || !hasFacets) base = r;
  }
  let list = base.filter(p=>FILTER_DEFS.every(([k,,get])=>!(S.filters[k]&&S.filters[k].length) || get(p).some(v=>S.filters[k].includes(String(v)))));
  list = list.map(p=>{
    const m = mutuals(p.id).length;
    let score = m*1.5 + (sharedSchool(p)?1:0) + (sharedPrev(p)?1:0);
    facets.company.forEach(c=>{ if(p.curCompany===c) score+=4; });
    return {p,score,m,reason:reasonFor(p,facets,rest)};
  });
  const yr=p=>Math.max(...p.schools.map(s=>s.year));
  list.sort((a,b)=> S.sort==='mutuals' ? (b.m-a.m || b.score-a.score) : S.sort==='year' ? (yr(b.p)-yr(a.p) || b.score-a.score) : (b.score-a.score || b.m-a.m));
  return {base,list,facets,rest};
}

function railData(key){

  if(key==='school'){
    const mine=me().schools[0]; const sc=SCHOOLS[mine.school];
    const items=P.filter(p=>p.id!==ME && p.schools.some(s=>s.school===mine.school)).sort((a,b)=>{const ya=a.schools.find(s=>s.school===mine.school).year, yb=b.schools.find(s=>s.school===mine.school).year; return Math.abs(ya-mine.year)-Math.abs(yb-mine.year) || yb-ya;})
      .map(p=>{const y=p.schools.find(s=>s.school===mine.school).year; return {p,sig:{txt:y===mine.year?'Your class':`${sc.tag} ${yy(y)} · ${Math.abs(y-mine.year)} yr${Math.abs(y-mine.year)>1?'s':''} ${y<mine.year?'ahead':'behind'}`,ico:'cap'}}});
    return {title:`Your ${sc.tag} community`,sub:`${sc.full} classmates and alumni, closest class years first`,items};
  }
  if(key==='pymk'){
    const items = P.filter(p=>p.id!==ME && connState(p.id)!=='connected').map(p=>{
      const s = mutuals(p.id).length*2 + (sharedSchool(p)?3:0) + (sharedPrev(p)?2:0) + (p.industry===me().industry?1:0);
      return {p,s};
    }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>({p:x.p}));

  if(key==='industry') return {title:`People in ${me().industry}`,sub:'Israeli MBAs working in your industry',items:P.filter(p=>p.id!==ME && p.industry===me().industry).sort((a,b)=>mutuals(b.id).length-mutuals(a.id).length).map(p=>({p,sig:{txt:`${p.industry} · ${p.roleCat}`,ico:'layers'}}))};
}

function filterOptions(base,k){
  const def=FILTER_DEFS.find(d=>d[0]===k); const m=new Map();
  base.forEach(p=>[...new Set(def[2](p).map(String))].forEach(v=>m.set(v,(m.get(v)||0)+1)));

  if(k==='degree') opts=['1st','2nd','3rd+'].map(v=>[v,m.get(v)||0]);
  else if(k==='year') opts.sort((a,b)=>b[0]-a[0]);

}

function connRows(id,mode){
  let ids = mode==='mutual' ? mutuals(id) : [...adj.get(id)].filter(x=>x!==ME);
  const q=S.connQ.trim().toLowerCase();
  let ppl = ids.map(byId).filter(m=>!q || m.name.toLowerCase().split(' ').some(w=>w.startsWith(q)) || (q.includes(' ') && m.name.toLowerCase().startsWith(q)));
  const ord=x=>{const i=S.connOrder.indexOf(x.id); return i<0?999:i;};
  if(S.connSort==='first') ppl.sort((a,b)=>a.first.localeCompare(b.first));
  else if(S.connSort==='last') ppl.sort((a,b)=>a.last.localeCompare(b.last));
  else if(S.connSort==='year') ppl.sort((a,b)=>Math.max(...b.schools.map(s=>s.year))-Math.max(...a.schools.map(s=>s.year)));
  else if(id===ME) ppl.sort((a,b)=>ord(a)-ord(b));
  if(!ppl.length) return `<li class="empty-row">${q?`No connections named “${esc(S.connQ)}”.`:'No connections here yet.'}</li>`;
  return ppl.map(m=>rrow(m, id===ME&&S.connAt[m.id]?`<span class="sub2">Connected ${esc(S.connAt[m.id])}</span>`:(id!==ME?mutualLine(m.id):''))).join('');

function commonGround(p){
  if(p.id===ME) return [];
  const out=[]; const m=me();
  p.schools.forEach(s=>{ const mine=m.schools.find(x=>x.school===s.school); if(mine) out.push([I.cap, s.year===mine.year?`Same class: ${SCHOOLS[s.school].tag} ${yy(s.year)}`:`Both ${SCHOOLS[s.school].tag} (${yy(s.year)} and ${yy(mine.year)})`]); });
  [p.curCompany,...p.prev].filter(Boolean).forEach(c=>{ if(m.prev.includes(c)) out.push([I.building,`You both worked at ${c}`]); });
  if(p.industry===m.industry) out.push([I.layers,`Both in ${p.industry}`]);
  if(p.location===m.location) out.push([I.pin,`Both based in ${p.location}`]);
  const ms = mutuals(p.id).length; if(ms) out.push([I.users,`${ms} mutual connection${ms>1?'s':''}`]);
  const unit = p.career.find(c=>c.company.startsWith('IDF')); const myUnit = m.career.find(c=>c.company.startsWith('IDF'));
  if(unit && myUnit && unit.company===myUnit.company) out.push([I.shield,`Both served in ${unit.company.replace('IDF · ','')}`]);
  return out;
}
function timeline(p,editable){

  const span = y=>{const m=y.split('–'),st=+m[0],en=m[1]?(m[1]==='Present'?9999:+m[1]):st; return [st,en]};
  items.sort((a,b)=>{const A=span(a.years),B=span(b.years); return B[1]-A[1]||B[0]-A[0]});

  }).join('')}</ol>`;
}

const TYPE_META = {school:['School',I.cap],company:['Company',I.building],industry:['Industry',I.layers],role:['Role',I.user],location:['Location',I.pin],status:['Member type',I.users]};
function hl(text,q){ if(!q) return esc(text); const i=text.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(text); return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length)); }
function suggestions(v){
  const q=v.trim().toLowerCase(); const groups=[];
  if(!q){
    if(S.recent.length) groups.push(['Recent searches',S.recent.map(r=>({kind:'q',q:r,html:esc(r),ico:I.clock}))]);
    groups.push(['Try a search',EXAMPLES.map(e=>({kind:'q',q:e,html:esc(e),ico:I.spark}))]);
    return groups;
  }
  const last = q.split(/\s+/).pop();
  const people = P.filter(p=>p.id!==ME && (p.name.toLowerCase().includes(q) || p.name.toLowerCase().split(' ').some(w=>w.startsWith(last)&&last.length>1))).slice(0,4);
  const ents=[]; const seen=new Set();
  for(const t of ORDER){ for(const [alias,val] of ENT[t]){ const key=t+val; if(seen.has(key)) continue;
    if(val.toLowerCase().includes(q) || alias.startsWith(q) || (last.length>1 && (alias.startsWith(last)||val.toLowerCase().startsWith(last)))){ seen.add(key); ents.push({t,val}); } } }
  const n = val => P.filter(p=>p.id!==ME && matchFacets(p,{...{school:[],company:[],location:[],industry:[],role:[],status:[],year:[]},[ents.find(e=>e.val===val).t]:[val]})).length;
  const items=[{kind:'q',q:v.trim(),html:`Search for “<b>${esc(v.trim())}</b>”`,ico:I.search,sub:runSearch(v.trim()).list.length+' matches'}];
  EXAMPLES.filter(e=>e.toLowerCase().includes(q)&&e.toLowerCase()!==q).forEach(e=>items.push({kind:'q',q:e,html:hl(e,v.trim()),ico:I.spark}));
  groups.push(['',items]);
  if(people.length) groups.push(['People',people.map(p=>({kind:'p',id:p.id,html:hl(p.name,last.length>1&&!p.name.toLowerCase().includes(q)?last:v.trim()),sub:`${p.schools.map(schoolTag).join(', ')} · ${p.role} · ${p.company}`,av:p}))]);
  const schoolsHit = ents.filter(e=>e.t==='school').map(e=>e.val);
  const {facets:qf} = parseQuery(v);
  const schoolsQ = [...new Set([...schoolsHit,...qf.school])];
  if(schoolsQ.length){
    const combos=[]; schoolsQ.forEach(k=>{ const sc=SCHOOLS[k]; const ys=[...new Set(P.filter(p=>p.id!==ME).flatMap(p=>p.schools.filter(s=>s.school===k).map(s=>s.year)))].sort((a,b)=>b-a);
      ys.forEach(y=>{ if(qf.year.length && !qf.year.includes(y)) return; const c=P.filter(p=>p.id!==ME&&p.schools.some(s=>s.school===k&&s.year===y)).length; combos.push({kind:'q',q:`${sc.tag} '${String(y).slice(2)}`,html:`${esc(sc.tag)} <span style="font-family:var(--f-mono)">'${String(y).slice(2)}</span>`,badge:classBadge({school:k,year:y,program:''}),sub:`${sc.full} · Class of ${y} · ${c} member${c>1?'s':''}`}); }); });
    if(combos.length) groups.splice(1,0,['Class years',combos.slice(0,6)]);
  }
  if(ents.length){
    // if the query already contains a recognised entity, offer combos
    groups.push(['Companies, schools & more',ents.slice(0,6).map(e=>{
      const prefix = q.endsWith(last) && q!==last ? v.trim().slice(0,v.trim().length-last.length).trim() : '';
      const full = prefix ? `${prefix} ${e.val}` : e.val;
      return {kind:'q',q:full,html:(prefix?esc(prefix)+' ':'')+hl(e.val,last),ico:TYPE_META[e.t][1],kindLabel:TYPE_META[e.t][0],sub:`${n(e.val)} members`};
    })]);
  }
  return groups;
}
function bindSearch(box){
  const input=box.querySelector('input'), ac=box.querySelector('.ac'); let items=[], idx=-1;
  const draw=()=>{
    const groups=suggestions(input.value); items=[];
    ac.innerHTML = groups.map(([h,list])=>(h?`<div class="ac-h">${h}</div>`:'')+list.map(it=>{const i=items.push(it)-1;
      return `<button class="ac-i ${i===idx?'on':''}" data-i="${i}" role="option" tabindex="-1">${it.av?av(it.av,32):it.badge?`<span style="width:64px;display:flex">${it.badge}</span>`:`<span class="ico">${it.ico}</span>`}<span><b>${it.html}</b>${it.sub?`<small>${esc(it.sub)}</small>`:''}</span>${it.kindLabel?`<span class="kind">${it.kindLabel}</span>`:''}</button>`}).join('')).join('');
    ac.hidden=false;
  };
  const pick=it=>{ ac.hidden=true; if(it.kind==='p') go('profile',{id:it.id}); else doSearch(it.q); };
  input.addEventListener('focus',()=>{idx=-1;draw()});
  input.addEventListener('input',()=>{idx=-1;draw()});
  input.addEventListener('blur',()=>setTimeout(()=>{ac.hidden=true},120));
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault(); idx=Math.min(items.length-1,idx+1); draw();}
    else if(e.key==='ArrowUp'){e.preventDefault(); idx=Math.max(-1,idx-1); draw();}
    else if(e.key==='Enter'){e.preventDefault(); if(idx>=0&&items[idx]) pick(items[idx]); else doSearch(input.value);}
    else if(e.key==='Escape'){ac.hidden=true; input.blur();}
  });
  ac.addEventListener('mousedown',e=>{const b=e.target.closest('.ac-i'); if(b){e.preventDefault(); pick(items[+b.dataset.i]);}});
  box.querySelector('.search-go')?.addEventListener('click',()=>doSearch(input.value));
}

/* ---------- profile editing (LinkedIn-style) ---------- */
const STORE_KEY='imn-my-profile-v1';
const ME_FIELDS=['first','last','role','location','industry','schools','career','email','phone','pref','photo','about','verify','reqId'];
const LOC_OPTIONS=['Boston','New York','SF Bay Area','Seattle','Los Angeles','Chicago','Washington, DC','Austin','Miami'];
const PROGRAMS=['MBA','EMBA','Sloan Fellows MBA','Part-time MBA','MBA/MS'];
const ySpan = y=>{const m=String(y).split('–'),st=+m[0],en=m[1]?(m[1]==='Present'?null:+m[1]):st; return [st,en]};
const fmtYears = (st,en)=> en==null?`${st}–Present`: st===en?`${st}`:`${st}–${en}`;
function recompute(p){
  p.name=`${p.first} ${p.last}`.trim();
  p.career.sort((a,b)=>{const A=ySpan(a.years),B=ySpan(b.years); return (B[1]??9999)-(A[1]??9999)||B[0]-A[0]});
  p.schools.sort((a,b)=>b.year-a.year);
  p.status = p.schools.some(s=>s.year>NOW_YEAR)?'Student':'Alum';
  const cur = p.career.find(c=>/Present/.test(c.years));

function loadPdfJs(){

const deEnt=t=>t.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#39;|&apos;/g,"'").replace(/&quot;/g,'"').replace(/\s+/g,' ').trim();

/* LinkedIn's "Save to PDF" layout: a sidebar (contact, skills) and a main column with name, headline, location,
   then sections (Summary, Experience, Education) whose titles use a larger font. In Experience the company line is
   the largest body text, then the job title, then smaller date, location and description lines. */
async function parseLinkedInPdf(file){
  const lib=await loadPdfJs();
  const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const side=[], main=[];
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i), w=pg.getViewport({scale:1}).width, tc=await pg.getTextContent(), rows=new Map();
    tc.items.forEach(it=>{ if(!it.str.trim()) return; const x=it.transform[4], y=Math.round(it.transform[5]), h=Math.abs(it.transform[3]);
      const k=(x<w*.33?'L':'R')+y; const r=rows.get(k)||{side:x<w*.33,y,h:0,t:''}; r.t+=it.str; r.h=Math.max(r.h,h); rows.set(k,r); });
    [...rows.values()].sort((a,b)=>b.y-a.y).forEach(r=>{ r.t=deEnt(r.t); r.page=i; if(/^Page ?\d+ ?of ?\d+$/i.test(r.t)) return; (r.side?side:main).push(r); });
  }
  const out={first:'',last:'',headline:'',location:'',email:'',url:'',about:'',career:[],education:[]};
  const sideTxt=side.map(r=>r.t).join(' ');
  out.email=(sideTxt.match(/[\w.+-]+@[\w-]+\.[\w.-]+/)||[''])[0];
  out.url=((sideTxt.match(/(?:www\.)?linkedin\.com\/in\/[\w%-]+/i)||[''])[0]).replace(/^www\./,'');
  if(!main.length) throw new Error('no text');
  const nameRow=main.reduce((a,b)=>b.h>a.h?b:a);
  const secH=Math.max(...main.filter(r=>r!==nameRow).map(r=>r.h));
  const isHead=r=>r!==nameRow && r.h>=secH-.5;
  const ni=main.indexOf(nameRow); const [first,...rest]=nameRow.t.split(' '); out.first=first; out.last=rest.join(' ');
  const top=[]; for(let i=ni+1;i<main.length&&!isHead(main[i]);i++) top.push(main[i].t);
  if(top.length>1) out.location=top.pop(); out.headline=top.join(' ');
  const sec={}; let cur=null; main.slice(ni+1).forEach(r=>{ if(isHead(r)){ cur=r.t.toLowerCase(); sec[cur]=[]; } else if(cur) sec[cur].push(r); });
  if(sec.summary) out.about=sec.summary.map(r=>r.t).join(' ');
  const ex=sec.experience||[];
  if(ex.length){
    const sizes=[...new Set(ex.map(r=>Math.round(r.h*2)/2))].sort((a,b)=>b-a);
    const coH=sizes[0], tiH=sizes.length>2?sizes[1]:null; let company='';
    ex.forEach((r,i)=>{ const h=Math.round(r.h*2)/2;
      if(h===coH && tiH!==null){ company=r.t; return; }
      const m=r.t.match(MONTH_YR); if(!m) return;
      const prev=ex[i-1]; if(!prev) return;
      const role = tiH===null||Math.round(prev.h*2)/2===tiH ? prev.t : '';
      if(tiH===null && ex[i-2]) company=ex[i-2].t;
      const nx=ex[i+1]; const loc = nx && nx.page===r.page && r.y-nx.y<=17 && !MONTH_YR.test(nx.t) && nx.t.length<70 && Math.round(nx.h*2)/2!==coH ? nx.t : '';
      out.career.push({company, role, years:fmtYears(+m[1], /Present/.test(r.t.slice(0,40))&&!m[2]?null:+(m[2]||m[1])), location:loc});
    });
  }
  const ed=sec.education||[];
  ed.forEach((r,i)=>{ const m=r.t.match(/^(.*?)\s*·\s*\((?:[A-Za-z]+ )?(\d{4})\s*-\s*(?:[A-Za-z]+ )?(\d{4})\)/); if(!m||!ed[i-1]) return;
    out.education.push({school:ed[i-1].t, degree:m[1].trim(), start:+m[2], end:+m[3]}); });
  return out;
}

async function joinPdf(file){
  const J=S.join; J.pdf='reading'; J.pdfErr=''; render();
  try{
    const r=await parseLinkedInPdf(file); if(!S.join) return;
    if(!r.first||(!r.career.length&&!r.education.length)) throw new Error('not a LinkedIn profile');
    const d=J.draft;
    Object.assign(d,{first:r.first,last:r.last,role:r.headline||d.role,email:r.email||d.email,about:r.about||d.about});
    const loc=matchLocation(r.location)||matchLocation(r.career[0]?.location); if(loc) d.location=loc;
    J.liurl=r.url;
    r.career.forEach(c=>{ if(!d.career.some(x=>x.company===c.company&&x.years===c.years)) d.career.push({...c,src:'pdf'}); });
    const mba=r.education.find(e=>matchSchool(e.school)&&/mba|business administration/i.test(e.degree))||r.education.find(e=>matchSchool(e.school));
    if(mba) d.schools=[{school:matchSchool(mba.school),program:'MBA',year:mba.end,start:mba.start}];
    d.src={name:'pdf',edu:mba?'pdf':'',role:'pdf'};
    J.found={...r,mba:mba?matchSchool(mba.school):null,locMapped:loc};
    J.pdf='done';
  }catch(err){ J.pdf='none'; J.pdfErr='We couldn’t read that file. Use the PDF from your LinkedIn profile: More → Save to PDF.'; }
  render();
}

async function joinSubmit(){

    phone:d.phone,linkedin:J.liurl||'',source:J.manual?'manual':'linkedin',answer:J.answer,about:d.about,career:d.career.map(({src,...c})=>c)};

function loginLinkedIn(){
  const L=S.join.login; L.err='';
  if(!BACKEND_URL||!LINKEDIN_CLIENT_ID){ L.err='LinkedIn login isn’t set up yet. Get a code by email instead.'; render(); return; }
  const state=crypto.randomUUID();
  try{ sessionStorage.setItem(LI_STATE_KEY,state); }catch(_){ }
  location.href='https://www.linkedin.com/oauth/v2/authorization?'+new URLSearchParams({response_type:'code',client_id:LINKEDIN_CLIENT_ID,
    redirect_uri:location.origin+location.pathname,scope:'openid profile email',state});

/* Back from LinkedIn: the page URL carries ?code&state (or ?error). Returns true if this load is a LinkedIn return. */
function handleLinkedInReturn(){
  const q=new URLSearchParams(location.search); if(!q.has('state')||!(q.has('code')||q.has('error'))) return false;
  history.replaceState(null,'',location.pathname);
  let want=null; try{ want=sessionStorage.getItem(LI_STATE_KEY); sessionStorage.removeItem(LI_STATE_KEY); }catch(_){ }
  S.firstRun=!loadMe(); joinStart('join'); const L=S.join.login={}; S.join.step='login';
  if(q.get('state')!==want){ L.err='That LinkedIn login didn’t come from this page. Try again.'; render(); return true; }
  if(q.has('error')){ L.err='LinkedIn login was cancelled.'; render(); return true; }
  L.liBusy=true; render();
  loginPost({action:'linkedin-login',code:q.get('code'),redirectUri:location.origin+location.pathname}).then(r=>{
    if(r.ok){ loginApply(r.profile); return; }
    L.err=r.error==='not-member'?`No approved member uses ${esc(r.email)}. Sign up first, or get a code by email if you signed up with a different address.`
      :r.error==='no-email'?'Your LinkedIn account has no verified email. Get a code by email instead.'
      :r.error==='not-configured'?'LinkedIn login isn’t set up on the server yet. Get a code by email instead.'
      :'LinkedIn login didn’t work. Try again, or get a code by email.';
    L.liBusy=false; render();
  }).catch(()=>{ L.err='We couldn’t reach the server. Check your connection and try again.'; L.liBusy=false; render(); });
  return true;
}
async function loginVerify(){
  const L=S.join.login, code=val('l-code').replace(/\D/g,''); L.err='';

  L.busy=true; render();

  }catch(_){ L.err='We couldn’t reach the server. Check your connection and try again.'; }
  L.busy=false; render();
}

  Object.assign(m,{first:p.first,last:p.last,role:p.headline,email:p.email,location:p.location||'Boston',industry:p.industry||Object.keys(INDUSTRIES)[0],
    phone:String(p.phone||''),pref:p.phone?'whatsapp':'email',about:p.about||'',photo:/^https:\/\//.test(p.photo||'')?p.photo:(m.email===p.email?m.photo:null),reqId:p.id,
    schools:[{school,program:'MBA',year:y,start:y-2}], career:p.career||[],
    verify:{school:p.status==='approved'?'admin':'pending',identity:false,workplace:false}});
  recompute(m); saveMe(); S.firstRun=false; S.join=null; go('home',{},false);
  toast(p.status==='approved'?`Welcome back, ${esc(p.first)}`:'You’re logged in. Your request is still waiting for an admin.');
}
/* Pending members: ask the backend whether an admin has decided yet. */
async function checkApproval(){
  const m=me(); if(!BACKEND_URL||m.verify.school!=='pending'||!m.reqId) return;
  try{
    const r=await (await fetch(BACKEND_URL+'?action=status&id='+encodeURIComponent(m.reqId))).json();
    if(r.ok&&r.status==='approved'){ m.verify.school='admin'; saveMe(); render(); toast('You’re approved! You’re now an official member.'); }
    if(r.ok&&r.status==='declined'){ toast('Your request to join wasn’t approved. Reply to any of our emails if you think that’s a mistake.'); }
  }catch(_){ }
}
function joinApply(schoolStatus){
  const d=S.join.draft, m=me();
  Object.assign(m,{first:d.first,last:d.last,role:d.role,email:d.email,location:d.location,industry:d.industry,phone:d.phone,pref:d.pref,about:d.about,
    schools:d.schools.map(s=>({...s})), career:d.career.map(({src,...c})=>c)});
  if(S.join.mode!=='sync') m.photo=null;
  m.verify={school:schoolStatus||m.verify.school, identity:false, workplace:false};
  recompute(m); saveMe();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(S.pill && !e.target.closest('.pillw')){ S.pill=null; if(!e.target.closest('[data-act]')){ render(); return; } }
  const t=e.target.closest('[data-act]'); if(!t) return;
  const id = t.dataset.id!==undefined ? +t.dataset.id : null;
  switch(t.dataset.act){
    case 'scrim': if(e.target===t) closeModal(); break;
    case 'close': closeModal(); break;
    case 'nav': S.browse=null; go(t.dataset.view); break;
    case 'back': back(); break;
    case 'profile': go('profile',{id}); break;
    case 'search': doSearch(t.dataset.q); break;
    case 'search-submit': break;
    case 'browse': S.browse = S.browse===t.dataset.tab?null:t.dataset.tab; render(); break;
    case 'see-all': go('list',{key:t.dataset.key}); break;
    case 'scroll': { const tr=document.getElementById('track-'+t.dataset.key); tr.scrollBy({left:+t.dataset.dir*tr.clientWidth*.8,behavior:'smooth'}); break; }
    case 'connect': openConnect(id); break;
    case 'send-request': sendRequest(id); break;
    case 'pending': toast(`Waiting for ${esc(byId(id).first)} to accept`); break;
    case 'accept': S.incoming.delete(id); markConnected(id); logInteraction(id,'Connected · just now'); softRender(id); toast(`You and ${esc(byId(id).first)} are now connected`,{act:byId(id).pref==='whatsapp'?'wa':'email',id,label:'Say hello'}); break;
    case 'decline': S.incoming.delete(id); render(); toast('Request ignored'); break;
    case 'withdraw': S.pending.delete(id); render(); toast('Request withdrawn'); break;
    case 'email': openContact(id,'email'); break;
    case 'wa': openContact(id,'wa'); break;
    case 'copy': { const txt=t.dataset.text; const done=()=>{t.innerHTML=I.check+'Copied'}; try{ navigator.clipboard.writeText(txt).then(done,()=>{done()}); }catch(_){ done(); } break; }
    case 'net-tab': S.netTab=t.dataset.tab; render(); break;
    case 'toggle-filters': S.showFilters=!S.showFilters; render(); break;
    case 'rm-filter': delete S.filters[t.dataset.k]; render(); break;
    case 'clear-filters': S.filters={}; S.pill=null; render(); break;
    case 'set-pref': me().pref=t.dataset.v; render(); toast(`Members will see you prefer ${t.dataset.v==='whatsapp'?'WhatsApp':'email'}`); break;
    case 'toast': toast(esc(t.dataset.msg)); break;
    case 'edit': openEdit(t.dataset.kind,t.dataset.idx); break;
    case 'join-start': joinStart(t.dataset.mode); break;
    case 'join-exit': S.join=null; go(S.stack.length?S.stack[S.stack.length-1].view:'home',S.stack.length?S.stack[S.stack.length-1].params:{}); break;
    case 'join-connect': joinConnect(); break;
    case 'join-pdf-again': S.join.pdf='none'; S.join.found=null; render(); break;
    case 'join-login': S.join.login=LINKEDIN_CLIENT_ID?{}:{emailMode:true}; S.join.step='login'; render(); window.scrollTo(0,0); break;
    case 'login-send': loginSendCode(); break;
    case 'login-li': loginLinkedIn(); break;
    case 'login-email-mode': S.join.login={emailMode:true}; render(); break;
    case 'login-li-mode': if(LINKEDIN_CLIENT_ID){ S.join.login={}; } else S.join.step='welcome'; render(); break;
    case 'login-verify': loginVerify(); break;
    case 'login-restart': S.join.login={emailMode:true,email:S.join.login.email}; render(); break;
    case 'join-manual': S.join.manual=true; S.join.draft.src={}; S.join.step='review'; render(); window.scrollTo(0,0); break;
    case 'join-go': S.join.step=t.dataset.step; render(); window.scrollTo(0,0); break;
    case 'join-rm': S.join.draft.career.splice(+t.dataset.idx,1); render(); break;
    case 'join-review-next': if(joinReadReview()){ if(S.join.mode==='sync'){ joinApply(); S.join=null; go('me',{},false); toast('Profile updated from LinkedIn'); } else { S.join.step='verify'; S.join.reqSent=false; render(); window.scrollTo(0,0); } } break;
    case 'join-finish': joinApply(t.dataset.status); me().reqId=S.join.reqId||null; saveMe(); S.firstRun=false; S.join.step='done'; render(); window.scrollTo(0,0); break;
    case 'join-demo-approve': { const m=me(); m.verify.school='admin'; saveMe(); render(); openRegEmail(m.first,m.email,'An admin approved your request. In the live app this lands in your inbox.'); break; }
    case 'join-request-send': { const J=S.join; J.answer=val('j-answer'); J.agree=document.getElementById('j-agree').checked; let ok=true;
      if(J.answer.length<10){ fieldErr('j-answer','Write a sentence or two for the admin'); ok=false; } else fieldErr('j-answer','');
      if(!J.agree){ fieldErr('j-agree','Confirm this to send your request'); ok=false; } else fieldErr('j-agree','');
      if(ok) joinSubmit(); break; }
    case 'jr-approve': case 'jr-decline': { const r=S.joinReqs.find(x=>x.id===id); S.joinReqs=S.joinReqs.filter(x=>x.id!==id); render();
      if(t.dataset.act==='jr-approve') openRegEmail(r.first,r.email,`You approved ${esc(r.name)}. In the live app this email goes out automatically.`); else toast(`Request from ${esc(r.first)} declined`); break; }
    case 'connections': S.connQ=''; if(S.view==='connections'&&S.params.id===id){ S.params={id,mode:t.dataset.mode}; render(); } else go('connections',{id,mode:t.dataset.mode}); break;
    case 'conn-filters': S.query=''; S.filters={degree:['1st']}; go('results'); break;
    case 'pill': { const k=t.dataset.k; if(S.pill===k){ S.pill=null; } else { S.pill=k; S.draft=[...(S.filters[k]||[])]; } render(); break; }
    case 'pill-cancel': S.pill=null; render(); break;
    case 'pill-apply': { const k=t.dataset.k; if(S.draft.length) S.filters[k]=[...S.draft]; else delete S.filters[k]; S.pill=null; render(); break; }
    case 'all-filters': S.pill=null; S.draftAll=null; render(); openAllFilters(); break;
    case 'drawer-scrim': if(e.target===t){ S.draftAll=null; closeModal(); } break;
    case 'drawer-close': S.draftAll=null; closeModal(); break;
    case 'drawer-reset': S.draftAll={}; openAllFilters(); break;
    case 'drawer-apply': S.filters=Object.fromEntries(Object.entries(S.draftAll||{}).filter(([,v])=>v&&v.length)); S.draftAll=null; closeModal(); render(); window.scrollTo(0,0); break;
    case 'save-edit': saveEdit(t.dataset.kind,t.dataset.idx); break;
    case 'delete-item': deleteItem(t.dataset.kind,t.dataset.idx); break;
    case 'add-section': openAddSection(); break;
    case 'photo-remove': photoDraft=null; document.getElementById('photo-prev').innerHTML=av({...me(),photo:null},180); break;
    case 'reset-me': try{localStorage.removeItem(STORE_KEY)}catch(_){ } location.reload(); break;
  }
});
document.addEventListener('input',e=>{ if(e.target.id==='conn-q'){ S.connQ=e.target.value; const l=document.getElementById('conn-list'); l.innerHTML=connRows(+l.dataset.id,l.dataset.mode); return; } const c=e.target.dataset.count; if(c){ const max=e.target.maxLength; document.getElementById(c).textContent=`${e.target.value.length}/${max.toLocaleString()}`; } });
document.addEventListener('change',e=>{
  if(e.target.id==='photo-file'){ readPhoto(e.target.files[0]); return; }
  if(e.target.id==='li-pdf'){ if(e.target.files[0]) joinPdf(e.target.files[0]); return; }
  if(e.target.id==='e-current'){ const end=document.getElementById('e-end'); end.disabled=e.target.checked; if(e.target.checked){ end.insertAdjacentHTML('afterbegin','<option>Present</option>'); end.value='Present'; } else { [...end.options].filter(o=>o.text==='Present').forEach(o=>o.remove()); end.value=String(NOW_YEAR); } return; }
  if(e.target.dataset.draft!==undefined){ const v=e.target.dataset.draft; S.draft = e.target.checked ? [...S.draft,v] : S.draft.filter(x=>x!==v); return; }
  if(e.target.dataset.dk!==undefined){ const k=e.target.dataset.dk, v=e.target.dataset.dv, cur=S.draftAll[k]||[]; S.draftAll[k]= e.target.checked?[...cur,v]:cur.filter(x=>x!==v); return; }
  if(e.target.id==='conn-sort'){ S.connSort=e.target.value; const l=document.getElementById('conn-list'); l.innerHTML=connRows(+l.dataset.id,l.dataset.mode); return; }
  if(e.target.dataset.sort!==undefined){ S.sort=e.target.value; render(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='l-email'){ e.preventDefault(); loginSendCode(); } if(e.key==='Enter'&&e.target.id==='l-code'){ e.preventDefault(); loginVerify(); } if(e.key==='Escape'){ closeModal(); S.draftAll=null; if(S.pill){ S.pill=null; render(); } } });
if(!handleLinkedInReturn()){ if(!loadMe()){ S.firstRun=true; joinStart('join'); } else checkApproval(); }
render();
</script>
